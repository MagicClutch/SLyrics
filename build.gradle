plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = 'slyrics'

repositories {
	exclusiveContent {
		forRepository { maven { url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
	maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// DevAuth: log in with your real Microsoft/Minecraft account in the dev client
	runtimeOnly "me.djtheredstoner:DevAuth-fabric:1.2.1"
	// Newer Minecraft no longer bundles Apache HttpClient, which DevAuth needs
	runtimeOnly "org.apache.httpcomponents:httpclient:4.5.14"
	// OneConfig holds the settings page; it needs PolyCompose and Fabric Language Kotlin
	runtimeOnly "maven.modrinth:oneconfig:${project.oneconfig_version}"
	runtimeOnly "maven.modrinth:fabric-language-kotlin:SKW1BTL3"
	runtimeOnly "maven.modrinth:polycompose:${project.polycompose_version}"
	// Polydium (Polyfrost's performance mod) to reproduce shader-pack clashes; run with -PnoPolydium to leave it out
	if (!project.hasProperty("noPolydium")) {
		runtimeOnly "maven.modrinth:polydium:DdODy1g5"
	}
	// PolyPlus (OneClient's lobby) to test the experimental lobby lyrics; run with -PnoLobby to leave it out
	if (!project.hasProperty("noLobby")) {
		runtimeOnly "maven.modrinth:polyplus:${project.polyplus_version}"
	}
}

processResources {
	def modVersion = project.version.toString()
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

loom {
	runs {
		client {
			// DevAuth logs the dev client in with your real account; -PnoDevAuth skips it (offline / login problems)
			property "devauth.enabled", project.hasProperty("noDevAuth") ? "false" : "true"
			property "devauth.account", "main"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// OneConfig is a dependency players install themselves: its jars are only on the compile classpath (never bundled). The modules sit nested inside the mod jar,
// so they are unpacked from it for compiling. OneConfig's HUD classes extend Compose / Kotlin types, so the runtime pieces of
// those (PolyCompose, Fabric Language Kotlin) are unpacked the same way.
configurations { oneConfigJar; composeJar; kotlinJar }
dependencies {
	oneConfigJar "maven.modrinth:oneconfig:${project.oneconfig_version}"
	composeJar "maven.modrinth:polycompose:${project.polycompose_version}"
	kotlinJar "maven.modrinth:fabric-language-kotlin:SKW1BTL3"
}
def oneConfigLibs = layout.buildDirectory.dir('oneconfig-libs')
tasks.register('unpackOneConfig', Sync) {
	from({ zipTree(configurations.oneConfigJar.singleFile).matching { include 'META-INF/jars/*.jar' } }) {
		eachFile { it.path = it.name }
		includeEmptyDirs = false
	}
	from({ configurations.oneConfigJar.singleFile }) // LegacyHud and the other version-specific classes sit in the mod jar itself
	from({ zipTree(configurations.composeJar.singleFile).matching { include 'META-INF/jars/polycompose-core*.jar', 'META-INF/jars/runtime-desktop*.jar', 'META-INF/jars/runtime-annotation*.jar' } }) {
		eachFile { it.path = it.name }
		includeEmptyDirs = false
	}
	from({ zipTree(configurations.kotlinJar.singleFile).matching { include 'META-INF/jars/kotlin-stdlib-2*.jar' } }) {
		eachFile { it.path = it.name }
		includeEmptyDirs = false
	}
	into oneConfigLibs
}
dependencies { compileOnly fileTree(dir: oneConfigLibs, include: ['oneconfig-*.jar', 'config*.jar', 'ui*.jar', 'utils*.jar', 'hud*.jar', 'events*.jar', 'polycompose-core*.jar', 'internal*.jar', 'runtime-*.jar', 'kotlin-stdlib*.jar']) }
tasks.named('compileJava') { dependsOn 'unpackOneConfig' }
