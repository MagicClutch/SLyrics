plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = 'slyrics'

repositories {
	exclusiveContent {
		forRepository { maven { url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
	maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }
}

// Skia's native library for the dev client's own OS
def osName = System.getProperty("os.name").toLowerCase()
def arm = System.getProperty("os.arch").contains("aarch64") || System.getProperty("os.arch").contains("arm")
def skikoPlatform = osName.contains("win") ? "windows-x64" : osName.contains("mac") ? (arm ? "macos-arm64" : "macos-x64") : (arm ? "linux-arm64" : "linux-x64")

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:resourceful-config:${project.rconfig_version}"
	// DevAuth: log in with your real Microsoft/Minecraft account in the dev client
	runtimeOnly "me.djtheredstoner:DevAuth-fabric:1.2.1"
	// Newer Minecraft no longer bundles Apache HttpClient, which DevAuth needs
	runtimeOnly "org.apache.httpcomponents:httpclient:4.5.14"
	// OneConfig (optional at runtime) so the dev client has it; run with -PnoOneConfig to test the mod without it
	if (!project.hasProperty("noOneConfig")) {
		runtimeOnly "maven.modrinth:oneconfig:${project.oneconfig_version}"
		runtimeOnly "maven.modrinth:fabric-language-kotlin:SKW1BTL3"
		runtimeOnly "maven.modrinth:compose-multiplatform:bMhjbdhu"
		runtimeOnly "org.jetbrains.skiko:skiko-awt-runtime-${skikoPlatform}:0.153.0"
		runtimeOnly "org.jetbrains.skiko:skiko-awt:0.153.0"
		runtimeOnly("org.jetbrains.compose.ui:ui-skiko-desktop:1.13.0-alpha02") { transitive = false }
	}
}

processResources {
	def modVersion = project.version.toString()
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

loom {
	runs {
		client {
			// DevAuth logs the dev client in with your real account; -PnoDevAuth skips it (offline / login problems)
			property "devauth.enabled", project.hasProperty("noDevAuth") ? "false" : "true"
			property "devauth.account", "main"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// OneConfig is optional: its jars are only on the compile classpath (never bundled). The modules sit nested inside the mod jar,
// so they are unpacked from it for compiling. OneConfig's HUD classes extend Compose / Kotlin types, so the runtime pieces of
// those (Compose Multiplatform, Fabric Language Kotlin) are unpacked the same way.
configurations { oneConfigJar; composeJar; kotlinJar }
dependencies {
	oneConfigJar "maven.modrinth:oneconfig:${project.oneconfig_version}"
	composeJar "maven.modrinth:compose-multiplatform:bMhjbdhu"
	kotlinJar "maven.modrinth:fabric-language-kotlin:SKW1BTL3"
}
def oneConfigLibs = layout.buildDirectory.dir('oneconfig-libs')
tasks.register('unpackOneConfig', Copy) {
	from({ zipTree(configurations.oneConfigJar.singleFile).matching { include 'META-INF/jars/*.jar' } }) {
		eachFile { it.path = it.name }
		includeEmptyDirs = false
	}
	from({ zipTree(configurations.composeJar.singleFile).matching { include 'META-INF/jars/runtime-desktop*.jar', 'META-INF/jars/runtime-annotation*.jar' } }) {
		eachFile { it.path = it.name }
		includeEmptyDirs = false
	}
	from({ zipTree(configurations.kotlinJar.singleFile).matching { include 'META-INF/jars/kotlin-stdlib-2*.jar' } }) {
		eachFile { it.path = it.name }
		includeEmptyDirs = false
	}
	into oneConfigLibs
}
dependencies { compileOnly fileTree(dir: oneConfigLibs, include: ['config*.jar', 'ui*.jar', 'utils*.jar', 'hud*.jar', 'events*.jar', 'poly-compose*.jar', 'internal*.jar', '26.3-fabric*.jar', 'runtime-*.jar', 'kotlin-stdlib*.jar']) }
tasks.named('compileJava') { dependsOn 'unpackOneConfig' }
